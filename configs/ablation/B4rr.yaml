name: B4rr   # ablation RQ2: B3 + rerank, giữ prompt rag_v1, không chặn → tách tác dụng rerank và prompt/ngưỡng
benchmark: benchmark/benchmark_v1.jsonl
data_version: v1
chunking: structure        # fixed | structure
chunk: {max_tokens: 512, overlap: 64}   # fixed: kích thước chunk; structure: ngưỡng tách Điều theo Khoản
retrieval: {mode: hybrid, top_k: 30, use_filter: true}   # none | dense | sparse | hybrid
context_n: 5           # số chunk đầu đưa vào prompt (B4: sau rerank, = rerank.top_n)
prompt: rag_v1         # src/generate/prompts.py
rerank: {enabled: true, model: BAAI/bge-reranker-v2-m3, max_length: 1024, top_n: 5,
         min_score: null}   # không chặn
llm: {provider: ollama, model: qwen2.5:7b-instruct-q4_K_M, temperature: 0.1, max_tokens: 600,
      num_ctx: 8192, num_gpu: 99, keep_alive: -1,   # num_ctx, num_gpu cố định lúc nạp model, xem src/generate/llm_client.py
      hf_tokenizer: Qwen/Qwen2.5-7B-Instruct}       # chỉ để đếm token prompt trước khi chạy (eval/run_eval.py)
seed: 42
