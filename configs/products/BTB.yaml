# Cấu hình xây kho tri thức cho 1 sản phẩm: scripts/build_kb.py --product BTB
# Khóa trong files = tên file (không đuôi) trong data/raw/products/BTB/; khóa riêng của file ghi đè meta sản phẩm.
product_code: BTB
product_name: Bảo Việt Tâm Bình
company: BHBV
line: phi_nhan_tho
effective_date: "2025-06-27"           # QĐ 6038/QĐ-BHBV ngày 27/06/2025; Điều 2: hiệu lực từ 01/07/2025
truth: data/truth/BTB.json
parse: {backend: pdfium, ocr: false, num_threads: 8}

files:
  btb_quytac:
    doc_type: quy_tac
    doc_label: Quy tắc
    structure: legal
    # Scan JPEG 200 ppi; lớp chữ Canon có sẵn mất dấu → OCR toàn trang, không dùng pdftotext (vocab, mục lục).
    # tessdata fast (apt), psm 3, 216 dpi: F1 túi từ trên trang song sinh 48–50 sau text_fixes 93,9% (best 93,8%,
    # chậm 4×); psm 6 phá bảng PL III; 300 dpi kém hơn (docs/ocr_probe_20261106.md).
    ocr: {lang: [vie], scale: 3.0}
    skip_pages: [1, 2, 3, 46, 47, 48, 49, 50]   # QĐ, bìa, mục lục; 46–50 = biểu phí + BQL bản scan, trùng 2 file có lớp chữ
    toc_page_offset: 2                          # trang scan = trang in + 2
    toc:                                        # chép tay từ mục lục trang 3 (OCR mục lục mất số trang)
      - ["CHƯƠNG I: ĐỊNH NGHĨA", 2]
      - ["CHƯƠNG II: PHẠM VI BẢO HIỂM", 13]
      - ["CHƯƠNG III: CÁC ĐIỂM LOẠI TRỪ CHUNG", 18]
      - ["CHƯƠNG IV: QUY ĐỊNH CHUNG", 23]
      - ["CHƯƠNG V: THỦ TỤC YÊU CẦU BỒI THƯỜNG VÀ BẢO LÃNH VIỆN PHÍ", 34]
      - ["PHỤ LỤC I: DANH MỤC BỆNH LÝ/TÌNH TRẠNG NGHIÊM TRỌNG", 37]
      - ["PHỤ LỤC II: DANH MỤC PHẪU THUẬT ĐẶC BIỆT", 38]
      - ["PHỤ LỤC III: BẢNG TỈ LỆ TRẢ TIỀN TỬ VONG/THƯƠNG TẬT VĨNH VIỄN", 39]
    numbered_units: [I, II, IV]                 # I: định nghĩa "N."; II: QL chính/bổ sung; IV: 1–18. V có mục La Mã → C5_M{n}
    part_heads:                                 # Chương II: 2 nhóm không đánh số, mỗi nhóm đánh số lại từ 1 → C2_A_M{n}, C2_B_M{n}
      A: '^QUY\S+ LỢI B\S+ HI\S+ CHÍNH'          # chịu lỗi dấu OCR (QUYÈN, HIẾM)
      B: '^QUY\S+ LỢI B\S+ HI\S+ B\S+ SUNG'
    text_fixes:   # chạy sau linearize, trước nhận cấu trúc. Từ không tồn tại → sửa độc lập; nhầm sang từ có thật → chỉ sửa theo ngữ cảnh
      - ['\b([Cc])h[ỉí]\s+phí\b', '\1hi phí']                # "chỉ phí" không bao giờ đúng
      - ['\bChỉ\s+trả\b', 'Chi trả']                         # đầu câu/ô bảng: "Chi trả theo chi phí thực tế"
      - ['\b(chỉ|đồng|đã|tự|Đồng)\s+chỉ\s+trả\b', '\1 chi trả']
      - ['\b([Bb]ảo|[Nn]guy)\s+hi[êếềệỄễ]+m\b', '\1 hiểm']
      - ['\bBẢO\s+HI[ÊẾỀỆỄ]+M\b', 'BẢO HIỂM']
      - ['\bQUY[ÈÊÉỀ]N\s+LỢI\b', 'QUYỀN LỢI']
      - ['\b([Bb])[ỗồóô]\s+sung\b', '\1ổ sung']
      - ['\bB[ỖỒÓÔ]\s+SUNG\b', 'BỔ SUNG']
      - ['\b([Tt])ô\s+chức\b', '\1ổ chức']
      - ['\b([Tt])ôn\s+thất\b', '\1ổn thất']
      - ['\b[Óó]m\s+đau\b', 'ốm đau']
      - ['\b([Tt])uôi\b', '\1uổi']
      - ['\b([Tt])hưc\b', '\1hực']
      - ['\b([Cc])âp\b', '\1ấp']
      - ['\b([Đđ])iêu\s+(trị|kiện|khoản)\b', '\1iều \2']
      - ['\b([Qq])uyên\s+(lợi|hạn)\b', '\1uyền \2']
      - ['\b([Cc]ó|[Cc]ơ)\s+thê\b', '\1 thể']
      - ['\b([Cc])h[âầấ]n\s+đoán\b', '\1hẩn đoán']
      - ['\b([Tt])ôi\s+(đa|thiểu)\b', '\1ối \2']
      - ['\b([Nn])ghĩ\s+(điều|việc|ốm)\b', '\1ghỉ \2']
      - ['\b([Tt])hai\s+sẵn\b', '\1hai sản']
  btb_bangquyenloi:
    doc_type: bang_quyen_loi
    doc_label: Bảng quyền lợi
    structure: flat
  btb_bieuphi:
    doc_type: bang_phi
    doc_label: Biểu phí
    structure: flat
    text_fixes:
      - ['(?<=\d),(?=\d{3}\b)', '.']           # Excel: 60,000,000 → 60.000.000 như các tài liệu khác

manual_units:                                   # chỉ có ở trang scan 47 của quy tắc, thiếu trong biểu phí Excel
  - doc_type: bang_phi
    doc_label: Biểu phí
    source_file: btb_quytac.pdf
    page: 47
    section_path: "Quyền lợi bổ sung 3 - Trợ cấp mất giảm thu nhập/trợ cấp lương"
    text: "| Quyền lợi bổ sung 3 - Trợ cấp mất giảm thu nhập/trợ cấp lương trong thời gian nghỉ điều trị theo chỉ định của bác sĩ điều trị | Tỷ lệ phí |\n|---|---|\n| Do tai nạn | 0,58% |\n| Do ốm bệnh | 0,50% |"

checks:
  definitions: {prefix: BTB_QT_C1_M, count: 52}
  page_range: {quy_tac: [4, 45]}                # trang scan
  forbidden:
    quy_tac: ["chỉ phí", "Chỉ phí", "bảo hiêm", "bảo hiếm", "BẢO HIẾM"]
  required:
    quy_tac:
      - "Bảo vệ và xử lý dữ liệu cá nhân"       # IV.17, mục lục bỏ sót
      - "từ 15 ngày tuổi đến 65 tuổi"           # IV.2.1
      - "Hỗ trợ giáo dục"                        # II.A.6
      - "Ghép tủy xương"                         # PL I.1
      - "Nguyên tắc xét trả tiền bảo hiểm"       # ghi chú chữ nghiêng dưới PL III (tr.45)
    bang_quyen_loi: ["6038/QĐ-BHBV", "330.000.000", "2.000.000/ngày"]
    bang_phi: ["6038/QĐ-BHBV", "3.198.000", "1.284.000", "0,58%"]   # 0,58% = manual_units
