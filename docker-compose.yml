services:
  qdrant:
    # Sau smoke test: thay latest bằng đúng version mà smoke test in ra, để kết quả tái lập được.
    image: qdrant/qdrant:v1.20.0
    container_name: bv-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
